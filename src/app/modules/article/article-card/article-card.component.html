<div class="card">
  <div class="card__header">
    <h2 class="card__title">{{ article.name }}</h2>
    <h4 class="card__brand">{{ article.brand.name }}</h4>
  </div>
  <div class="card__body">
    <p class="card__description">{{ article.description }}</p>
  </div>
  <div class="card__body"></div>
  <div class="card__footer">
    <div
      class="card__categories"
      *ngIf="article?.categories && article.categories.length > 0"
    >
      <strong class="card__categories-label">Categorías:</strong>
      <ng-container *ngFor="let category of article.categories; let i = index">
        <span *ngIf="i < 3" class="card__category">
          {{ category.name
          }}<span
            class="card__category-separator"
            *ngIf="i < 2 && article.categories.length > 1"
            >,
          </span>
        </span>
      </ng-container>
    </div>
    <p class="card__price">Precio: ${{ article.price }}</p>

    <p class="card__quantity">Disponible: {{ article.quantity }}</p>
  </div>
  <div class="card__buttons">
    <app-button buttonText="Añadir"></app-button>
    <button class="card__add" *ngIf="warehouseAssistant" (click)="onOpenModal()">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
        <g
          id="SVGRepo_tracerCarrier"
          stroke-linecap="round"
          stroke-linejoin="round"
        ></g>
        <g id="SVGRepo_iconCarrier">
          <g id="Edit / Add_Plus_Square">
            <path
              id="Vector"
              d="M8 12H12M12 12H16M12 12V16M12 12V8M4 16.8002V7.2002C4 6.08009 4 5.51962 4.21799 5.0918C4.40973 4.71547 4.71547 4.40973 5.0918 4.21799C5.51962 4 6.08009 4 7.2002 4H16.8002C17.9203 4 18.4801 4 18.9079 4.21799C19.2842 4.40973 19.5905 4.71547 19.7822 5.0918C20.0002 5.51962 20.0002 6.07967 20.0002 7.19978V16.7998C20.0002 17.9199 20.0002 18.48 19.7822 18.9078C19.5905 19.2841 19.2842 19.5905 18.9079 19.7822C18.4805 20 17.9215 20 16.8036 20H7.19691C6.07899 20 5.5192 20 5.0918 19.7822C4.71547 19.5905 4.40973 19.2842 4.21799 18.9079C4 18.4801 4 17.9203 4 16.8002Z"
              stroke="#9D3FE7"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            ></path>
          </g>
        </g>
      </svg>
    </button>
  </div>
</div>
