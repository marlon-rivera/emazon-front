<div class="content">
  <app-button
    class="list-articles-page__filter"
    buttonText="Filtrar por categorías"
    (buttonClick)="toggleCategories()"
  ></app-button>

  <app-button
    class="list-articles-page__filter"
    buttonText="Filtrar por marcas"
    (buttonClick)="toggleBrands()"
  ></app-button>

    <aside
      class="list-articles-page__categories"
      [ngClass]="{
        'list-articles-page__categories--visible': this.isCategoriesVisible
      }"
    >
      <h4 class="list-articles-page__categories-title">
        Filtra por <span class="highlight">Categorías</span>
      </h4>
      <app-button
        *ngIf="this.isCategoriesVisible"
        (buttonClick)="toggleCategories()"
        buttonText="Ocultar filtro"
      ></app-button>

      <div class="list-articles-page__checkbox-group">
        <label
          *ngFor="let category of categories"
          class="list-articles-page__checkbox-label"
        >
          <input
            type="checkbox"
            class="list-articles-page__checkbox-input"
            [value]="category.id"
            (change)="onCategorySelected($event)"
          />
          {{ category.name }}
        </label>
      </div>
    </aside>
    <div class="cart">
      <app-button
        [buttonText]="order"
        (buttonClick)="changeOrder()"
      ></app-button>
      <div *ngFor="let article of articlesShoppingCart.articles.list">
        <div class="cart__item">
          <div class="cart__item-info">
            <h3 class="cart__item-name">{{ article.name }}</h3>
            <p class="cart__item-category">
              Disponible
              <span *ngIf="article.quantity > 0; else showDate"
                >: {{ article.quantity }}</span
              >
              <ng-template #showDate
                >en:
                {{ article.deliveryDate | date : "dd/MM/yyyy" }}</ng-template
              >
            </p>
          </div>
          <div class="cart__item-controls">
            <div class="cart__item-quantity">
              <app-button buttonText="-" (buttonClick)="decreaseQuantity(article.id)"></app-button>
              <app-input-field
                type="number"
                [value]="toString(article.quantityRequired)"
                (valueChange)="quantityChange(article.id, $event)"
              ></app-input-field>
              <app-button buttonText="+" (buttonClick)="increaseQuantity(article.id)"></app-button>
            </div>
          </div>
        </div>
      </div>
      <p><span class="highlight"> Total:</span> {{ articlesShoppingCart.totalPrice | currency:'USD':'symbol':'1.2-2' }}</p>
      <div
        class="list-articles-page__pagination"
        *ngIf="this.articlesShoppingCart.articles.totalPages > 1"
      >
        <a
          href="javascript:void(0)"
          (click)="changePage(currentPage - 1)"
          [class.table__pagination-arrow--disabled]="currentPage === 0"
          class="list-articles-page__pagination-arrow"
        >
          &lt;
        </a>

        <span *ngFor="let page of getVisiblePages(); let i = index">
          <ng-container *ngIf="page === -1">
            <ng-template #ellipsis>...</ng-template>
            <ng-container *ngTemplateOutlet="ellipsis"></ng-container>
          </ng-container>

          <a
            *ngIf="page !== -1"
            href="javascript:void(0)"
            (click)="changePage(page)"
            [class.list-articles-page__pagination-number--active]="
              currentPage === page
            "
            class="list-articles-page__pagination-number"
          >
            {{ page + 1 }}
          </a>
        </span>

        <a
          href="javascript:void(0)"
          (click)="changePage(currentPage + 1)"
          [class.table__pagination-arrow--disabled]="
            currentPage === this.articlesShoppingCart.articles.totalPages - 1
          "
          class="list-articles-page__pagination-arrow"
        >
          &gt;
        </a>
      </div>
    </div>
    <aside
      class="list-articles-page__categories"
      [ngClass]="{
        'list-articles-page__categories--visible': this.isBrandsVisible
      }"
    >
      <h4 class="list-articles-page__categories-title">
        Filtra por <span class="highlight">Marcas</span>
      </h4>
      <app-button
        *ngIf="this.isBrandsVisible"
        (buttonClick)="toggleBrands()"
        buttonText="Ocultar filtro"
      ></app-button>
      <div class="list-articles-page__checkbox-group">
        <label
          *ngFor="let brand of brands"
          class="list-articles-page__checkbox-label"
        >
          <input
            type="checkbox"
            class="list-articles-page__checkbox-input"
            [value]="brand.id"
            (change)="onBrandSelected($event)"
          />
          {{ brand.name }}
        </label>
      </div>
    </aside>
</div>
