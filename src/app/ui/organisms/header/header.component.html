<header class="header">
  <div class="header__container">
    <div class="header__logo">
      <app-logo></app-logo>
    </div>
    <div class="header__login" *ngIf="!isLogged">
      <a class="header__login__login" routerLink="/auth/login">
        <img
          src="assets/icon_person.png"
          alt="User Icon"
          class="header__login__icon"
        />
        Ingresar
      </a>
      /
      <a class="header__login__signup" routerLink="/auth/register"> Registrarse </a>
    </div>
    <div class="header__login" *ngIf="isLogged">
      <img
        src="assets/icon_person.png"
        alt="User Icon"
        class="header__login__icon"
      />
      <p>{{ username }}</p>
      <button class="header__login__button" (click)="logout()">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          width="25"
          xmlns="http://www.w3.org/2000/svg"
        >
          <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
          <g
            id="SVGRepo_tracerCarrier"
            stroke-linecap="round"
            stroke-linejoin="round"
          ></g>
          <g id="SVGRepo_iconCarrier">
            <path
              d="M15 16.5V19C15 20.1046 14.1046 21 13 21H6C4.89543 21 4 20.1046 4 19V5C4 3.89543 4.89543 3 6 3H13C14.1046 3 15 3.89543 15 5V8.0625M11 12H21M21 12L18.5 9.5M21 12L18.5 14.5"
              stroke="#9D3FE7"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            ></path>
          </g>
        </svg>
      </button>
    </div>
  </div>
</header>
